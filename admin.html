<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>入居時チェック｜管理</title>
<style>
:root{--ink:#17171A;--ink2:#3F3F46;--ink3:#71717A;--line:#E4E4E7;--line2:#D4D4D8;
      --bg:#F5F5F6;--ng:#B23A28;--ngbg:#FCEFEC;--okbg:#F1F5F2;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.7;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;}
button,input,textarea,select{font-family:inherit;font-size:17px;}
header{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  display:flex;align-items:center;gap:12px;}
header b{font-size:19px;font-weight:800;flex:1;}
header button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:100px;
  padding:9px 17px;font-size:15px;font-weight:700;cursor:pointer;}
main{max-width:760px;margin:0 auto;padding:14px 14px 60px;}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-bottom:14px;}
h2{font-size:19px;font-weight:800;margin:0 0 12px;}
label.f{display:block;font-size:13.5px;font-weight:800;color:var(--ink3);
  letter-spacing:.04em;margin:12px 0 4px;}
input[type=text],input[type=password],input[type=email],input[type=date],textarea{
  width:100%;padding:13px 14px;border:1.5px solid var(--line2);border-radius:11px;background:#fff;}
input:focus,textarea:focus{outline:none;border-color:var(--ink);}
.row{display:flex;gap:10px;}
.row > *{flex:1;min-width:0;}
.btn{display:block;width:100%;border:0;border-radius:13px;padding:15px;
  font-size:17.5px;font-weight:800;background:var(--ink);color:#fff;cursor:pointer;margin-top:16px;}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line2);}
.btn.sm{padding:11px 18px;font-size:15px;width:auto;margin:0;border-radius:100px;}
.btn[disabled]{opacity:.4;}
.err{color:var(--ng);font-size:15px;font-weight:700;min-height:1.2em;}

/* 集計 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center;}
.stat b{display:block;font-size:34px;font-weight:800;line-height:1.2;}
.stat span{font-size:13.5px;color:var(--ink3);font-weight:700;}
.stat.warn{background:var(--ngbg);border-color:#F0CFC8;}
.stat.warn b{color:var(--ng);}

/* 一覧 */
.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 14px;margin-bottom:10px;}
.item.over{border-color:var(--ng);background:var(--ngbg);}
.item.done{background:var(--okbg);}
.i-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.i-h b{font-size:18px;font-weight:800;}
.pill{font-size:13px;font-weight:800;letter-spacing:.04em;border-radius:100px;
  padding:4px 12px;border:1px solid var(--line2);color:var(--ink2);background:#fff;white-space:nowrap;}
.pill.ok{background:var(--ink);border-color:var(--ink);color:#fff;}
.pill.ng{background:var(--ng);border-color:var(--ng);color:#fff;}
.i-b{font-size:15px;color:var(--ink3);margin-top:7px;line-height:1.75;}
.i-a{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;}

/* 特約の選択 */
.cl{display:block;border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:7px;cursor:pointer;}
.cl.on{border-color:var(--ink);background:#FAFAFA;}
.cl input{width:20px;height:20px;margin-right:10px;vertical-align:-4px;accent-color:var(--ink);}
.cl b{font-size:15.5px;font-weight:700;}
.clh{display:flex;align-items:center;gap:8px;}
.clh .ar{margin-left:auto;font-size:13px;color:#888;flex:0 0 auto;}
.cl.open .clh .ar{transform:rotate(180deg);}
.clb{margin-top:9px;}
.cle{width:100%;box-sizing:border-box;font:inherit;font-size:13.5px;line-height:1.75;
     border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-height:96px;background:#fff;}
.cl.edited{border-color:#c2410c;}
.cl.edited .clh b:after{content:'（直しました）';font-size:11px;color:#c2410c;font-weight:700;margin-left:6px;}
.warn{background:#fff7ed;border:1px solid #fdba74;color:#9a3412;border-radius:10px;
      padding:10px 12px;font-size:13px;line-height:1.8;margin:8px 0;}
.cl .m{font-size:12px;font-weight:800;background:var(--ink);color:#fff;border-radius:100px;padding:1px 7px;margin-left:6px;}
.scroll{max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:8px;background:#FAFAFA;}

.made{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:14px;margin-top:14px;}
.made .k{font-size:13px;font-weight:800;color:var(--ink3);letter-spacing:.06em;margin-top:10px;}
.made .v{font-size:16px;word-break:break-all;background:#F5F5F6;border-radius:9px;padding:8px 10px;margin-top:3px;}
.made .pass{font-size:34px;font-weight:800;letter-spacing:.28em;text-align:center;}
.hide{display:none !important;}
#veil{position:fixed;inset:0;z-index:60;background:rgba(255,255,255,.9);display:none;
  align-items:center;justify-content:center;font-weight:800;}
#veil.on{display:flex;}
.thumb{width:100%;border-radius:11px;border:1px solid var(--line);margin-top:8px;display:block;}

/* ============ ここから追加 ============ */

/* 期間のえらび（年度・月） */
.filt{display:flex;gap:8px;margin-bottom:12px;}
.filt select{flex:1;min-width:0;padding:12px 12px;border:1.5px solid var(--line2);
  border-radius:11px;background:#fff;font-weight:700;color:var(--ink);}

/* 集計の札は押せます（押すと、その中身だけの一覧になります） */
.tabs3{display:flex;gap:8px;margin-bottom:12px;}
.tabs3 button{flex:1;padding:12px 6px;border-radius:12px;border:1.5px solid var(--line2);
  background:#fff;font:inherit;font-size:15px;font-weight:800;color:var(--ink3);cursor:pointer;}
.tabs3 button.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.tabs3 button i{font-style:normal;font-weight:800;opacity:.75;}
.pill.exp{background:var(--ng);color:#fff;border-color:var(--ng);}
.item.exp{border-color:var(--ng);}
#agbox{position:fixed;inset:0;z-index:220;background:rgba(0,0,0,.55);display:none;
  align-items:center;justify-content:center;padding:14px;}
#agbox.on{display:flex;}
#agbox .in{background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:90vh;
  display:flex;flex-direction:column;overflow:hidden;}
#agbox .hd{padding:13px 15px;border-bottom:1px solid var(--line);}
#agbox .hd b{font-size:16px;}
#agbox .hd p{margin:4px 0 0;font-size:13px;color:var(--ink3);line-height:1.7;}
#agbox input,#agbox textarea{width:100%;box-sizing:border-box;font:inherit;font-size:14px;
  border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin:0 0 8px;}
#agbox textarea{min-height:280px;line-height:1.8;resize:vertical;}
#agbox .bd{padding:13px 15px;overflow:auto;}
#agbox .ft{display:flex;gap:8px;padding:12px 15px;border-top:1px solid var(--line);}

.stat{cursor:pointer;transition:background .12s,border-color .12s;}
.stat:active{background:#F0F0F1;}
.stat.on{border:2px solid var(--ink);background:#FAFAFA;padding:15px 9px;}
.stat.on span{color:var(--ink);}

/* 一覧の1件も押せます（押すと中身が開きます） */
.item{cursor:pointer;}
.item:active{background:#F4F4F5;}

/* 中身を見る画面 */
#detail{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:none;}
#detail.on{display:block;}
#detail .inner{max-width:760px;margin:0 auto;padding:14px 14px 60px;}
.d-bar{position:sticky;top:0;z-index:2;background:var(--ink);color:#fff;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px;}
.d-bar b{font-size:19px;font-weight:800;flex:1;}
.d-bar button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:100px;
  padding:9px 17px;font-size:15px;font-weight:700;cursor:pointer;}
.d-k{font-size:13px;font-weight:800;color:var(--ink3);letter-spacing:.06em;margin:16px 0 7px;}
.d-item{border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:8px;background:#fff;}
.d-item.ng{border-color:var(--ng);background:var(--ngbg);}
.d-item b{font-size:16px;font-weight:800;display:block;}
.d-item p{margin:7px 0 0;font-size:15px;color:var(--ink2);white-space:pre-wrap;}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px;}
.ph a{display:block;border:1px solid var(--line);border-radius:10px;
  overflow:hidden;background:#fff;text-align:center;text-decoration:none;}
.ph img{width:100%;height:140px;object-fit:cover;display:block;background:#F0F0F1;}
.ph span{display:block;font-size:13px;font-weight:800;padding:9px 4px;color:var(--ink2);}
/* ============ ここまで追加 ============ */
</style>
</head>
<body>

<header>
  <b>入居時チェック｜管理</b>
  <button id="tab-new">新規</button>
  <button id="tab-list">一覧</button>
</header>

<main>

  <!-- パスワード -->
  <section id="s-key">
    <div class="card">
      <h2>管理用パスワード</h2>
      <input type="password" id="key" placeholder="パスワード" autocomplete="current-password">
      <div class="err" id="key-err"></div>
      <button class="btn" id="key-go">開く</button>
    </div>
  </section>

  <!-- 新規作成 -->
  <section id="s-new" class="hide">
    <div class="card">
      <h2>新しいチェック依頼をつくる</h2>
      <div class="row">
        <div><label class="f">物件名 *</label><input type="text" id="f-bldg" placeholder="例: テタンジェ"></div>
        <div style="max-width:120px;"><label class="f">号室 *</label><input type="text" id="f-room" placeholder="例: 203"></div>
      </div>
      <label class="f">契約者名 *</label>
      <input type="text" id="f-name" placeholder="例: 山田 太郎">
      <label class="f">メールアドレス *</label>
      <input type="email" id="f-mail" inputmode="email" placeholder="例: taro@example.com">
      <label class="f">入居日</label>
      <input type="date" id="f-move">
      <label class="f">エリア（担当者が分かれます。返信の通知は、このエリアの担当者へ届きます）</label>
      <select id="f-area" style="width:100%;box-sizing:border-box;font:inherit;font-size:15px;
        border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:#fff;"></select>
      <label class="f">仲介業者（「説明を受けていない」と回答があったとき、ここへ連絡できます）</label>
      <div class="row">
        <div><input type="text" id="f-agco" placeholder="会社名　例: ○○不動産"></div>
        <div style="max-width:150px;"><input type="text" id="f-agnm" placeholder="担当者　例: 山田"></div>
      </div>
      <input type="email" id="f-agml" inputmode="email" placeholder="仲介業者のメールアドレス">
      <label class="f">間取り図（写真でも可）</label>
      <input type="file" id="f-plan" accept="image/*">
      <img id="plan-th" class="thumb hide" alt="">
      <label class="f">この契約に該当する特約（チェックしたものだけ入居者に出ます／<b>タイトルを押すと文面が開きます</b>）</label>
      <div id="cl-warn" class="warn hide"></div>
      <div class="row" style="margin-bottom:8px;">
        <button type="button" class="btn ghost sm" id="cl-all">全選択</button>
        <button type="button" class="btn ghost sm" id="cl-none">全解除</button>
        <button type="button" class="btn ghost sm" id="cl-out" style="margin-left:auto;">特約の文面を書き出す</button>
      </div>
      <div class="scroll" id="cl-list"></div>
      <label class="f">個別に伝えたいこと（1行に1件。入居者側でも印を付けていただきます）</label>
      <textarea id="f-extra" rows="3" placeholder="例）バルコニーの物干し竿は、前の入居者のものです。ご自由にお使いください。"
        style="width:100%;box-sizing:border-box;font:inherit;font-size:14px;line-height:1.8;border:1px solid var(--line);border-radius:9px;padding:9px 11px;"></textarea>
      <label class="f">社内メモ（入居者には出ません）</label>
      <input type="text" id="f-memo" placeholder="任意">
      <div class="err" id="new-err"></div>
      <button class="btn" id="new-go">送信する</button>
      <div id="made" class="made hide"></div>
    </div>
  </section>

  <!-- 一覧 -->
  <section id="s-list" class="hide">
    <div class="filt">
      <select id="f-fy"></select>
      <select id="f-mo"></select>
      <select id="f-far"></select>
    </div>
    <div class="tabs3" id="tabs3">
      <button type="button" data-t="todo" class="on">要対応 <i>0</i></button>
      <button type="button" data-t="waiting">未返信 <i>0</i></button>
      <button type="button" data-t="done">完了 <i>0</i></button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="card" style="padding:12px;">
      <div class="row" style="margin-bottom:10px;">
        <input type="text" id="q" placeholder="物件名・お名前で探す">
        <button class="btn sm ghost" id="reload" style="flex:0 0 auto;">更新</button>
      </div>
      <div id="list"></div>
    </div>
  </section>

</main>

<div id="agbox">
  <div class="in">
    <div class="hd">
      <b>仲介業者へ連絡する</b>
      <p>下の文面は、そのまま直せます。送ると、自社（転送先）にも控えが届きます。</p>
    </div>
    <div class="bd">
      <label class="f">宛先</label>
      <input type="email" id="ag-to">
      <label class="f">件名</label>
      <input type="text" id="ag-sub">
      <label class="f">本文</label>
      <textarea id="ag-body"></textarea>
    </div>
    <div class="ft">
      <button class="btn" id="ag-send" style="flex:1;">この内容で送る</button>
      <button class="btn ghost" id="ag-cancel" style="flex:0 0 30%;">やめる</button>
    </div>
  </div>
</div>

<div id="detail">
  <div class="d-bar"><b id="d-title">　</b><button id="d-close">閉じる</button></div>
  <div class="inner" id="d-body"></div>
</div>

<div id="veil">読み込んでいます…</div>

<script src="clauses.js?v=1"></script>
<script src="config.js?v=1"></script>
<script>
(function(){
  'use strict';
  var CFG = window.APP_CONFIG || {};
  var KEY = '';
  var ROWS = [];
  var planData = null;

  function $(s){ return document.querySelector(s); }
  function $$(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function veil(on){ $('#veil').classList.toggle('on', !!on); }
  function post(b){
    return fetch(CFG.GAS_URL, { method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(b) })
      .then(function(r){ return r.json(); });
  }

  /* ---- パスワード ---- */
  $('#key-go').addEventListener('click', function(){
    KEY = $('#key').value.trim();
    if(!KEY){ $('#key-err').textContent = 'パスワードを入れてください。'; return; }
    veil(true);
    post({ action:'list', key:KEY }).then(function(res){
      veil(false);
      if(!res.ok){ $('#key-err').textContent = res.err || '開けませんでした。'; return; }
      try{ localStorage.setItem('ire_checkin_key', KEY); }catch(e){}
      ROWS = res.rows;
      if(res.areas && res.areas.length) AREAS = res.areas;
      buildPeriod(); buildArea(); drawAll();
      $('#s-key').classList.add('hide');
      show('list');
    }).catch(function(){ veil(false); $('#key-err').textContent = '通信できませんでした。'; });
  });
  try{ var k = localStorage.getItem('ire_checkin_key'); if(k) $('#key').value = k; }catch(e){}

  function show(which){
    $('#s-new').classList.toggle('hide', which !== 'new');
    $('#s-list').classList.toggle('hide', which !== 'list');
    window.scrollTo(0,0);
  }
  $('#tab-new').addEventListener('click', function(){ if(KEY) show('new'); });
  $('#tab-list').addEventListener('click', function(){ if(KEY){ show('list'); reload(); } });

  /* ---- 特約の一覧（タイトルを押すと文面が開きます。文面はその場で直せます） ----

     直した文面は、この端末に控えます。
     ほかの人にも反映するには「特約の文面を書き出す」で clauses.js を作り、
     GitHub の checkin/clauses.js に貼り替えてください。
     貼り替えるまでは、この画面にオレンジの注意が出ます。         */
  var EDKEY = 'checkin_clause_edit';
  function edLoad(){ try{ return JSON.parse(localStorage.getItem(EDKEY) || '{}') || {}; }catch(e){ return {}; } }
  function edSave(o){ try{ localStorage.setItem(EDKEY, JSON.stringify(o||{})); }catch(e){} }
  var EDITS = edLoad();

  function bodyOf(c){ return (EDITS[c.t] !== undefined) ? EDITS[c.t] : c.b; }

  function edWarn(){
    var k = Object.keys(EDITS), el = $('#cl-warn');
    if(!k.length){ el.classList.add('hide'); el.innerHTML = ''; return; }
    el.classList.remove('hide');
    el.innerHTML = '⚠️ 文面を ' + k.length + ' 件 直しました。<b>この端末にしか残っていません。</b><br>' +
                   '「特約の文面を書き出す」を押して、GitHub の <b>checkin/clauses.js</b> に貼り替えてください。';
  }

  function drawClauses(){
    $('#cl-list').innerHTML = (window.CLAUSES||[]).map(function(c){
      var ed = (EDITS[c.t] !== undefined);
      return '<div class="cl' + (ed ? ' edited' : '') + '" data-t="' + esc(c.t) + '">' +
        '<div class="clh"><input type="checkbox">' +
          '<b>' + esc(c.t) + '</b>' + (c.money ? '<span class="m">お金</span>' : '') +
          '<span class="ar">▾</span></div>' +
        '<div class="clb hide"><textarea class="cle" rows="4">' + esc(bodyOf(c)) + '</textarea></div>' +
      '</div>';
    }).join('');

    $$('#cl-list .cl').forEach(function(el){
      var t   = el.getAttribute('data-t');
      var box = el.querySelector('input');
      var bd  = el.querySelector('.clb');
      var ta  = el.querySelector('.cle');

      box.addEventListener('click', function(ev){ ev.stopPropagation(); });
      box.addEventListener('change', function(){ el.classList.toggle('on', box.checked); });

      el.querySelector('.clh').addEventListener('click', function(ev){
        if(ev.target === box) return;
        bd.classList.toggle('hide');
        el.classList.toggle('open', !bd.classList.contains('hide'));
      });

      ta.addEventListener('click', function(ev){ ev.stopPropagation(); });
      ta.addEventListener('input', function(){
        var org = '';
        (window.CLAUSES||[]).forEach(function(c){ if(c.t === t) org = c.b; });
        if(ta.value === org) delete EDITS[t]; else EDITS[t] = ta.value;
        edSave(EDITS);
        el.classList.toggle('edited', EDITS[t] !== undefined);
        edWarn();
      });
    });
    edWarn();
  }
  drawClauses();

  $('#cl-all').addEventListener('click', function(){
    $$('#cl-list .cl').forEach(function(e){ e.querySelector('input').checked = true; e.classList.add('on'); }); });
  $('#cl-none').addEventListener('click', function(){
    $$('#cl-list .cl').forEach(function(e){ e.querySelector('input').checked = false; e.classList.remove('on'); }); });

  /* 直した文面を入れた clauses.js を作って、ダウンロードします */
  $('#cl-out').addEventListener('click', function(){
    function q(v){ return "'" + String(v == null ? '' : v).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\r?\n/g, '\\n') + "'"; }
    var L = [];
    L.push('/* =====================================================================');
    L.push('   重要事項説明書の 特約事項（入居者に確認していただく内容）');
    L.push('   ※ 管理画面の「特約の文面を書き出す」で作りました  ' + new Date().toLocaleString('ja-JP'));
    L.push('   ===================================================================== */');
    L.push('window.CLAUSES = [');
    (window.CLAUSES||[]).forEach(function(c, i, arr){
      L.push('  { no:' + c.no + ', money:' + (c.money ? 'true' : 'false') + ', t:' + q(c.t) + ',');
      L.push('    b:' + q(bodyOf(c)) + ' }' + (i < arr.length - 1 ? ',' : ''));
    });
    L.push('];');
    L.push('');
    L.push('/* 室内で見ていただく場所（既定） */');
    L.push('window.PLACES = [');
    L.push('  ' + (window.PLACES||[]).map(q).join(',\n  ') );
    L.push('];');
    L.push('');
    L.push('/* 暮らしのルール（お住まいのあいだ、守っていただくこと） */');
    L.push('window.MANNERS = [');
    L.push('  ' + (window.MANNERS||[]).map(q).join(',\n  ') );
    L.push('];');
    var txt = L.join('\n') + '\n';
    showOut(txt);
  });

  /* 書き出した文面を、画面に出します。
     以前はファイルとして落としていましたが、.js は Windows がメモ帳で開いてくれず、
     「開かない」ということが起きました。GitHub へ貼るだけなので、
     画面に出して「すべてコピー」できれば十分です。 */
  function showOut(txt){
    var back = document.getElementById('out-back');
    if(!back){
      back = document.createElement('div');
      back.id = 'out-back';
      back.style.cssText = 'position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);' +
                           'display:flex;align-items:center;justify-content:center;padding:16px;';
      back.innerHTML =
        '<div style="background:#fff;border-radius:14px;max-width:820px;width:100%;' +
             'max-height:88vh;display:flex;flex-direction:column;overflow:hidden;">' +
          '<div style="padding:14px 16px;border-bottom:1px solid #e4e4e7;">' +
            '<div style="font-size:16px;font-weight:800;">特約の文面（clauses.js）</div>' +
            '<div style="font-size:13px;color:#71717a;margin-top:4px;line-height:1.7;">' +
              '下の「すべてコピー」を押してから、GitHub の <b>checkin/clauses.js</b> を開いて、' +
              '中身を全部消して貼り付けてください。<br>' +
              '貼り替えたら、この画面の「直しました」の印は消して構いません。' +
            '</div>' +
          '</div>' +
          '<textarea id="out-txt" readonly spellcheck="false" ' +
            'style="flex:1;min-height:300px;margin:0;border:0;border-bottom:1px solid #e4e4e7;' +
                   'padding:12px 14px;font-family:ui-monospace,Menlo,Consolas,monospace;' +
                   'font-size:12.5px;line-height:1.6;resize:none;outline:none;"></textarea>' +
          '<div style="display:flex;gap:8px;padding:12px 16px;">' +
            '<button type="button" id="out-copy" class="btn" style="flex:1;">すべてコピー</button>' +
            '<button type="button" id="out-save" class="btn ghost" style="flex:0 0 34%;">.txt で保存</button>' +
            '<button type="button" id="out-close" class="btn ghost" style="flex:0 0 20%;">閉じる</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(back);

      back.addEventListener('click', function(e){ if(e.target === back) back.style.display = 'none'; });
      document.getElementById('out-close').addEventListener('click', function(){ back.style.display = 'none'; });

      document.getElementById('out-copy').addEventListener('click', function(){
        var ta = document.getElementById('out-txt'), btn = this;
        ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
        var done = false;
        try{ done = document.execCommand('copy'); }catch(e){}
        if(!done && navigator.clipboard){
          navigator.clipboard.writeText(ta.value).then(function(){
            btn.textContent = 'コピーしました'; setTimeout(function(){ btn.textContent = 'すべてコピー'; }, 1600);
          }, function(){ alert('コピーできませんでした。文字を選んで Ctrl+C を押してください。'); });
          return;
        }
        btn.textContent = done ? 'コピーしました' : 'コピーできませんでした';
        setTimeout(function(){ btn.textContent = 'すべてコピー'; }, 1600);
      });

      document.getElementById('out-save').addEventListener('click', function(){
        try{
          var a = document.createElement('a');
          a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(document.getElementById('out-txt').value);
          a.download = 'clauses_貼り付け用.txt';       /* .js だと開けないので .txt にします */
          document.body.appendChild(a); a.click(); a.remove();
        }catch(e){ alert('保存できませんでした： ' + e.message); }
      });
    }
    back.style.display = 'flex';
    var t = document.getElementById('out-txt');
    t.value = txt;
    t.focus(); t.select();
  }

  /* ---- 間取り図 ---- */
  $('#f-plan').addEventListener('change', function(){
    var f = this.files && this.files[0];
    if(!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      var im = new Image();
      im.onload = function(){
        var M = 1600, w = im.width, h = im.height;
        if(w > M || h > M){ var s = M/Math.max(w,h); w = Math.round(w*s); h = Math.round(h*s); }
        var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(im, 0, 0, w, h);
        planData = cv.toDataURL('image/jpeg', 0.8);
        $('#plan-th').src = planData; $('#plan-th').classList.remove('hide');
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(f);
  });

  /* ---- つくる ---- */
  function create(sendMail){
    var body = {
      action:'create', key:KEY,
      bldg:$('#f-bldg').value.trim(), room:$('#f-room').value.trim(),
      name:$('#f-name').value.trim(), mail:$('#f-mail').value.trim(),
      moveIn:$('#f-move').value, memo:$('#f-memo').value.trim(),
      area:$('#f-area').value,
      agentCo:$('#f-agco').value.trim(), agentName:$('#f-agnm').value.trim(),
      agentMail:$('#f-agml').value.trim(),
      clauses:$$('#cl-list .cl').filter(function(e){ return e.querySelector('input').checked; })
                .map(function(e){ return e.getAttribute('data-t'); })
                .concat(($('#f-extra').value || '').split(/\r?\n/)
                  .map(function(x){ return x.trim(); })
                  .filter(function(x){ return x; })),
      sendMail: !!sendMail
    };
    if(planData) body.plan = { data:planData, name:'madori.jpg' };
    if(!body.bldg || !body.room || !body.name || !body.mail){
      $('#new-err').textContent = '物件名・号室・お名前・メールは必ず入れてください。'; return;
    }
    $('#new-err').textContent = '';
    veil(true);
    post(body).then(function(res){
      veil(false);
      if(!res.ok){ $('#new-err').textContent = res.err || 'つくれませんでした。'; return; }
      $('#made').classList.remove('hide');
      $('#made').innerHTML =
        '<b>つくりました' + (sendMail ? '（入居者へメールを送りました）' : '（メールは送っていません）') + '</b>' +
        '<div class="k">入力ページ</div><div class="v" id="mv-url">' + esc(res.url) + '</div>' +
        '<div class="k">パスワード</div><div class="v pass">' + esc(res.pass) + '</div>' +
        '<button class="btn ghost sm" id="copy" style="margin-top:12px;">案内文をコピー</button>';
      $('#copy').addEventListener('click', function(){
        var t = body.name + ' 様\n\n' +
          body.bldg + ' ' + body.room + ' のお部屋の確認をお願いいたします。\n\n' +
          '▼ 入力ページ\n' + res.url + '\n　パスワード： ' + res.pass + '\n';
        navigator.clipboard.writeText(t).then(function(){ $('#copy').textContent = 'コピーしました'; });
      });
      ['#f-bldg','#f-room','#f-name','#f-mail','#f-memo','#f-extra'].forEach(function(s){ $(s).value=''; });
      planData = null; $('#plan-th').classList.add('hide'); $('#f-plan').value='';
    }).catch(function(){ veil(false); $('#new-err').textContent = '通信できませんでした。'; });
  }
  $('#new-go').addEventListener('click', function(){ create(true); });

  /* ---- 一覧 ---- */
  var FILT = '';   /* 押している札。'' のときは、ぜんぶ出します */

  var TAB = 'todo';        /* 要対応／未返信／完了 */
  var AREAS = [];

  function reload(){
    veil(true);
    /* 年度はサーバー側でしぼります。件数が増えても重くなりません。
       0 を渡すと全部returnされます */
    var fy = $('#f-fy').value;
    post({ action:'list', key:KEY, fy:(fy === '' ? 0 : Number(fy)) }).then(function(res){
      veil(false);
      if(!res.ok) return;
      ROWS = res.rows;
      if(res.areas && res.areas.length) AREAS = res.areas;
      buildPeriod(); buildArea(); drawAll();
    }).catch(function(){ veil(false); });
  }

  /* エリアのえらび */
  function buildArea(){
    var sel = $('#f-far');
    if(sel.options.length && sel.getAttribute('data-built') === String(AREAS.length)) return;
    var keep = sel.value;
    sel.innerHTML = '<option value="">エリア：すべて</option>' +
      AREAS.map(function(a){ return '<option value="' + esc(a) + '">' + esc(a) + '</option>'; }).join('');
    sel.setAttribute('data-built', String(AREAS.length));
    sel.value = keep || '';
    /* 新規作成の画面にも、同じえらびを入れます */
    var f = $('#f-area');
    if(f && !f.options.length){
      f.innerHTML = '<option value="">（未設定）</option>' +
        AREAS.map(function(a){ return '<option value="' + esc(a) + '">' + esc(a) + '</option>'; }).join('');
    }
  }
  $('#reload').addEventListener('click', reload);
  $('#q').addEventListener('input', drawList);
  $('#f-fy').addEventListener('change', reload);
  $('#f-mo').addEventListener('change', drawAll);

  function drawAll(){ drawTabs(); drawStats(); drawList(); }

  function drawTabs(){
    var rows = ROWS.filter(inPeriod);
    var n = { todo:0, waiting:0, done:0 };
    rows.forEach(function(r){
      var st = String(r.status||'');
      if(st === '取消') return;
      if(st === '完了') n.done++;
      else if(st === '返信済') n.todo++;
      else n.waiting++;
    });
    $$('#tabs3 button').forEach(function(b){
      var k = b.getAttribute('data-t');
      b.classList.toggle('on', TAB === k);
      b.querySelector('i').textContent = n[k];
    });
  }
  $$('#tabs3 button').forEach(function(b){
    b.addEventListener('click', function(){
      TAB = b.getAttribute('data-t');
      FILT = '';                    /* タブを変えたら、数字のしぼり込みは外します */
      drawAll();
    });
  });
  $('#f-far').addEventListener('change', drawAll);

  /* 年度は4月はじまりです。2026年4月〜2027年3月＝2026年度 */
  function ymOf(v){ var m = /^(\d{4})\/(\d{2})/.exec(String(v||'')); return m ? {y:+m[1], m:+m[2]} : null; }
  function fyOf(v){ var t = ymOf(v); return t ? (t.m >= 4 ? t.y : t.y - 1) : null; }

  /* 年度のえらびを、たまっている分から作ります */
  function buildPeriod(){
    var keep = $('#f-fy').value;
    var fys = [];
    ROWS.forEach(function(r){
      var f = fyOf(r.created);
      if(f !== null && fys.indexOf(f) < 0) fys.push(f);
    });
    var now = new Date();
    var nowFy = (now.getMonth() + 1) >= 4 ? now.getFullYear() : now.getFullYear() - 1;
    if(fys.indexOf(nowFy) < 0) fys.push(nowFy);
    fys.sort(function(a,b){ return b - a; });
    $('#f-fy').innerHTML = '<option value="">年度：すべて</option>' +
      fys.map(function(f){
        return '<option value="' + f + '">' + f + '年度（' + f + '年4月〜' + (f+1) + '年3月）</option>';
      }).join('');
    $('#f-fy').value = keep || '';
    if(!$('#f-mo').options.length){
      var o = ['<option value="">月：すべて</option>'];
      for(var i=1;i<=12;i++) o.push('<option value="' + i + '">' + i + '月</option>');
      $('#f-mo').innerHTML = o.join('');
    }
  }

  function inPeriod(r){
    var fy = $('#f-fy').value, mo = $('#f-mo').value, ar = $('#f-far').value;
    if(fy && String(fyOf(r.created)) !== fy) return false;
    if(mo){ var t = ymOf(r.created); if(!t || t.m !== Number(mo)) return false; }
    if(ar && String(r.area||'') !== ar) return false;
    return true;
  }

  /* いま選んでいるタブに入るかどうか */
  function inTab(r){
    var st = String(r.status||'');
    if(st === '取消') return false;
    if(TAB === 'done')    return st === '完了';
    if(TAB === 'waiting') return st !== '完了' && st !== '返信済';
    return st === '返信済';                      /* 要対応 */
  }

  function matchFilt(r){
    if(!FILT) return true;
    if(FILT === 'ng')     return r.ng > 0;
    if(FILT === 'exp')    return r.noExp > 0;
    if(FILT === 'over')   return r.over;
    if(FILT === 'remind') return r.remind > 0;
    return true;
  }

  function drawStats(){
    var rows = ROWS.filter(inPeriod).filter(inTab);
    var st = { all:rows.length, ng:0, exp:0, over:0, remind:0 };
    rows.forEach(function(r){
      if(r.ng > 0) st.ng++;
      if(r.noExp > 0) st.exp++;
      if(r.over) st.over++;
      if(r.remind > 0) st.remind++;
    });
    $('#stats').innerHTML =
      cell('',       st.all,    'このタブの件数') +
      cell('ng',     st.ng,     '問題の報告', st.ng > 0) +
      cell('exp',    st.exp,    '説明を受けていない', st.exp > 0) +
      cell('over',   st.over,   '期限すぎ', st.over > 0) +
      cell('remind', st.remind, '督促を送った') +
      cell('',       0,         '', false, true);
    function cell(k,n,l,warn,blank){
      if(blank) return '<div class="stat" style="visibility:hidden"></div>';
      return '<div class="stat' + (warn ? ' warn' : '') + (FILT === k ? ' on' : '') +
        '" data-k="' + k + '"><b>' + n + '</b><span>' + l + '</span></div>';
    }
    $$('#stats .stat').forEach(function(el){
      el.addEventListener('click', function(){
        var k = el.getAttribute('data-k');
        FILT = (FILT === k) ? '' : k;   /* もう一度押すと、しぼり込みを外します */
        drawAll();
      });
    });
  }

  function drawList(){
    var q = $('#q').value.trim();
    var rows = ROWS.filter(function(r){
      if(!inPeriod(r)) return false;
      if(!inTab(r)) return false;
      if(!matchFilt(r)) return false;
      if(!q) return true;
      return (r.bldg + r.room + r.name + (r.area||'') + (r.agentCo||'')).indexOf(q) >= 0;
    });
    if(!rows.length){ $('#list').innerHTML = '<p style="color:#71717A;font-size:15px;">ありません。</p>'; return; }
    $('#list').innerHTML = rows.map(function(r){
      var st   = String(r.status||'');
      var fin  = (st === '完了');
      var done = (st === '返信済' || fin);
      var exp  = (r.noExp > 0);
      var pill = fin
        ? '<span class="pill ok">完了</span>'
        : (done
            ? (exp ? '<span class="pill exp">説明を受けていない ' + r.noExp + '</span>'
                   : (r.ng > 0 ? '<span class="pill ng">要確認 ' + r.ng + '</span>'
                               : '<span class="pill ok">問題なし</span>'))
            : (r.over ? '<span class="pill ng">期限すぎ</span>' : '<span class="pill">未返信</span>'));
      var sub = [];
      if(r.area) sub.push(esc(r.area));
      if(r.agentCo || r.agentName) sub.push('仲介：' + esc(r.agentCo||'') + ' ' + esc(r.agentName||''));
      var acts = [];
      if(!done){
        acts.push('<button class="btn sm ghost act-remind">督促メールを送る</button>');
        acts.push('<button class="btn sm ghost act-copy">案内文をコピー</button>');
      }else if(!fin){
        if(exp && r.agentMail) acts.push('<button class="btn sm ghost act-agent">仲介へ連絡する</button>');
        acts.push('<button class="btn sm act-done">完了にする</button>');
      }else{
        acts.push('<button class="btn sm ghost act-undo">完了をもどす</button>');
      }
      return '<div class="item' + (fin ? ' done' : (exp ? ' exp' : (done ? ' done' : (r.over ? ' over' : '')))) +
        '" data-id="' + esc(r.id) + '">' +
        '<div class="i-h"><b>' + esc(r.bldg) + ' ' + esc(r.room) + '</b>' + pill + '</div>' +
        '<div class="i-b">' + esc(r.name) + ' 様 ／ ' + esc(r.mail) + '<br>' +
          (sub.length ? (sub.join(' ／ ') + '<br>') : '') +
          '作成 ' + esc(String(r.created).slice(0,10)) + ' ／ 期限 ' + esc(r.due) +
          (r.replied ? ' ／ 返信 ' + esc(String(r.replied).slice(0,10)) : '') +
          (r.doneAt ? ' ／ 完了 ' + esc(String(r.doneAt).slice(0,10)) : '') +
          (r.remind ? ' ／ 督促 ' + r.remind + '回' : '') + '</div>' +
        (acts.length ? ('<div class="i-a">' + acts.join('') + '</div>') : '') +
      '</div>';
    }).join('');

    /* 完了にする／もどす */
    $$('.act-done, .act-undo').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.closest('.item').getAttribute('data-id');
        var undo = b.classList.contains('act-undo');
        if(!confirm(undo ? '完了をもどしますか？' : 'この件を完了にしますか？\n（完了タブへ移ります）')) return;
        veil(true);
        post({ action:'done', key:KEY, id:id, undo:undo }).then(function(res){
          veil(false);
          if(!res.ok){ alert(res.err || 'できませんでした'); return; }
          reload();
        }).catch(function(){ veil(false); alert('通信できませんでした。'); });
      });
    });

    /* 仲介へ連絡する */
    $$('.act-agent').forEach(function(b){
      b.addEventListener('click', function(){
        openAgent(b.closest('.item').getAttribute('data-id'));
      });
    });
    $$('.act-remind').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.closest('.item').getAttribute('data-id');
        if(!confirm('督促メールを送りますか？')) return;
        veil(true);
        post({ action:'remind', key:KEY, id:id }).then(function(res){
          veil(false); alert(res.ok ? '送りました。' : (res.err||'送れませんでした'));
          reload();
        }).catch(function(){ veil(false); alert('通信できませんでした。'); });
      });
    });
    $$('.act-copy').forEach(function(b){
      b.addEventListener('click', function(){
        var it = b.closest('.item');
        var r = ROWS.filter(function(x){ return x.id === it.getAttribute('data-id'); })[0];
        var url = location.href.replace(/admin\.html.*$/,'') + '?id=' + r.id;
        navigator.clipboard.writeText(r.name + ' 様\n\n▼ 入力ページ\n' + url + '\n')
          .then(function(){ b.textContent = 'コピーしました'; });
      });
    });
    /* 1件を押したら、中身を開きます（ボタンを押したときは開きません） */
    $$('#list .item').forEach(function(el){
      el.addEventListener('click', function(ev){
        if(ev.target.closest('button')) return;
        openDetail(el.getAttribute('data-id'));
      });
    });
  }

  /* ---- 仲介業者へ連絡する ---- */
  var AG_ID = '';
  function openAgent(id){
    AG_ID = id;
    veil(true);
    post({ action:'agentMail', key:KEY, id:id, preview:true }).then(function(d){
      veil(false);
      if(!d.ok){ alert(d.err || '開けませんでした。'); return; }
      $('#ag-to').value   = d.to || '';
      $('#ag-sub').value  = d.subject || '';
      $('#ag-body').value = d.body || '';
      $('#agbox').classList.add('on');
    }).catch(function(){ veil(false); alert('通信できませんでした。'); });
  }
  $('#ag-cancel').addEventListener('click', function(){ $('#agbox').classList.remove('on'); });
  $('#agbox').addEventListener('click', function(e){ if(e.target === this) this.classList.remove('on'); });
  $('#ag-send').addEventListener('click', function(){
    var to = $('#ag-to').value.trim();
    if(!to){ alert('宛先を入れてください。'); return; }
    if(!confirm(to + ' へ送ります。よろしいですか？')) return;
    veil(true);
    post({ action:'agentMail', key:KEY, id:AG_ID, to:to,
           subject:$('#ag-sub').value, body:$('#ag-body').value }).then(function(res){
      veil(false);
      if(!res.ok){ alert(res.err || '送れませんでした'); return; }
      $('#agbox').classList.remove('on');
      alert('送りました。');
      reload();
    }).catch(function(){ veil(false); alert('通信できませんでした。'); });
  });

  /* ---- 1件の中身を見る ---- */
  /* ドライブのURLから、その場で見られる画像のURLを作ります */
  function driveThumb(u){
    var m = /[-\w]{25,}/.exec(String(u||''));
    return m ? 'https://drive.google.com/thumbnail?id=' + m[0] + '&sz=w800' : '';
  }

  function openDetail(id){
    veil(true);
    post({ action:'detail', key:KEY, id:id }).then(function(d){
      veil(false);
      if(!d.ok){ alert(d.err || '開けませんでした。'); return; }
      $('#d-title').textContent = d.bldg + ' ' + d.room;
      var h = [];

      h.push('<div class="card">');
      h.push('<div class="i-h"><b>' + esc(d.name) + ' 様</b></div>');
      h.push('<div class="i-b">' + esc(d.mail) + '<br>' +
        (d.area ? ('エリア ' + esc(d.area) + '<br>') : '') +
        ((d.agentCo || d.agentName || d.agentMail)
          ? ('仲介 ' + esc(d.agentCo||'') + ' ' + esc(d.agentName||'') + ' ' + esc(d.agentMail||'') + '<br>') : '') +
        '作成 ' + esc(String(d.created).slice(0,10)) + ' ／ 状態 ' + esc(d.status) +
        (d.replied ? ' ／ 返信 ' + esc(String(d.replied).slice(0,10)) : '') +
        '<br>パスワード ' + esc(d.pass) +
        (d.memo ? '<br>社内メモ ' + esc(d.memo) : '') + '</div>');
      if(d.plan){
        h.push('<div class="ph" style="margin-top:12px;"><a href="' + esc(d.plan) +
               '" target="_blank" rel="noopener"><img src="' + esc(driveThumb(d.plan)) +
               '" alt="" onerror="this.style.display=\'none\'">' +
               '<span>間取り図をひらく</span></a></div>');
      }
      h.push('</div>');

      if(!d.rooms.length && !d.checks.length){
        h.push('<div class="card"><p style="margin:0;color:#71717A;">まだ返信がありません。</p></div>');
      }

      if(d.rooms.length){
        h.push('<div class="d-k">お部屋の中</div>');
        d.rooms.forEach(function(x){
          var ng = (x.judge !== '問題なし');
          h.push('<div class="d-item' + (ng ? ' ng' : '') + '">');
          h.push('<b>' + esc(x.place) + '　<span class="pill' + (ng ? ' ng' : '') + '">' +
                 esc(x.judge) + '</span></b>');
          if(x.comment) h.push('<p>' + esc(x.comment) + '</p>');
          if(x.photos.length){
            h.push('<div class="ph">' + x.photos.map(function(u){
              return '<a href="' + esc(u) + '" target="_blank" rel="noopener">' +
                     '<img src="' + esc(driveThumb(u)) + '" alt="" ' +
                     'onerror="this.style.display=\'none\'">' +
                     '<span>写真をひらく</span></a>';
            }).join('') + '</div>');
          }
          h.push('</div>');
        });
      }

      if(d.checks.length){
        h.push('<div class="d-k">ご説明の確認</div>');
        d.checks.forEach(function(x){
          var no = (x.judge !== '確認した');
          var isExp = no && String(x.comment||'').indexOf('説明を受けていない') === 0;
          h.push('<div class="d-item' + (no ? ' ng' : '') + '"><b>' + esc(x.place) +
                 '　<span class="pill' + (isExp ? ' exp' : (no ? ' ng' : ' ok')) + '">' +
                 esc(isExp ? '説明を受けていない' : x.judge) + '</span></b>' +
                 (no && x.comment ? ('<p>' + esc(x.comment) + '</p>') : '') + '</div>');
        });
      }

      if(d.clauses && d.clauses.length){
        h.push('<div class="d-k">この契約に付けた特約</div>');
        h.push('<div class="d-item"><p>' + esc(d.clauses.join('\n')) + '</p></div>');
      }

      $('#d-body').innerHTML = h.join('');
      $('#detail').classList.add('on');
      $('#detail').scrollTop = 0;
    }).catch(function(){ veil(false); alert('通信できませんでした。'); });
  }
  $('#d-close').addEventListener('click', function(){
    $('#detail').classList.remove('on');
  });
})();
</script>
</body>
</html>
